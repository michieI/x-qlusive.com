<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="description" content="Creating the Global Platform for Arts, Entertainment and Nightlife.">
    <title>X-QLUSIVE</title>
    <link rel="icon" type="image/x-icon" href="x_favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="x_favicon.png">
    <link rel="preload" as="image" href="x-mark.png" fetchpriority="high">
    <link rel="preload" as="image" href="background-1920.webp"
      imagesrcset="background-960.webp 960w, background-1920.webp 1920w"
      imagesizes="100vw" fetchpriority="high">
    <script>document.documentElement.classList.add('is-loading');</script>
    <style>
      :root { color-scheme: dark; background: #000; }
      * { box-sizing: border-box; }
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #000;
        touch-action: none;
      }
      main {
        position: relative;
        isolation: isolate;
        width: 100%;
        height: 100vh;
        height: 100svh;
        min-height: 360px;
        overflow: hidden;
        background: #000;
        opacity: 1;
        transition: opacity 180ms ease-out;
      }
      .is-loading main { opacity: 0; }
      .is-ready main { opacity: 1; }
      @media (prefers-reduced-motion: reduce) {
        main { transition: none; }
        .mark-echo { animation: none; opacity: 0; }
      }
      .scene {
        position: absolute;
        z-index: 0;
        inset: 0;
      }
      .scene::before {
        content: none;
      }
      .background {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
        object-position: center;
        pointer-events: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-user-drag: none;
        opacity: 1;
        filter: none;
        transform: none;
      }
      .mark-shell {
        position: absolute;
        z-index: 4;
        left: 32vw;
        top: 50%;
        width: clamp(220px, 25vw, 390px);
        aspect-ratio: 585 / 414;
        transform: translate3d(-50%, -50%, 0);
        pointer-events: none;
      }
      .mark-fallback {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        filter: drop-shadow(0 0 16px rgba(255, 255, 255, .18));
      }

      .mark-echo {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        opacity: 0;
        filter: brightness(1.08);
        animation: fragmented-echo 6.8s steps(1, end) infinite;
        pointer-events: none;
        -webkit-user-drag: none;
      }
      .mark-echo--top {
        clip-path: polygon(0 0, 100% 0, 100% 29%, 0 36%);
      }
      .mark-echo--middle {
        clip-path: polygon(0 31%, 100% 25%, 100% 67%, 0 72%);
        animation-delay: 55ms;
      }
      .mark-echo--bottom {
        clip-path: polygon(0 69%, 100% 63%, 100% 100%, 0 100%);
        animation-delay: 110ms;
      }
      @keyframes fragmented-echo {
        0%, 10%, 19%, 31%, 41%, 100% { opacity: 0; transform: translate3d(0, 0, 0) scale(1); }
        11% { opacity: .7; transform: translate3d(-5.5%, .5%, 0) scale(1.01); }
        12% { opacity: .3; transform: translate3d(4%, -.5%, 0) scale(.995); }
        13% { opacity: 0; }
        32% { opacity: .55; transform: translate3d(4.5%, 0, 0) scale(1.008); }
        33% { opacity: .2; transform: translate3d(-3%, .3%, 0) scale(1); }
        34% { opacity: 0; }
      }
      .manifesto {
        position: absolute;
        z-index: 4;
        right: 7.5vw;
        top: 50%;
        width: min(36vw, 620px);
        margin: 0;
        transform: translateY(-50%);
        color: #f2f2f2;
        font: 400 clamp(2rem, 4vw, 4.75rem) / .98 Arial, Helvetica, sans-serif;
        letter-spacing: -.04em;
        text-wrap: balance;
      }
      .separator {
        position: absolute;
        z-index: 4;
        left: 50%;
        top: 50%;
        width: 1px;
        height: clamp(190px, 18vw, 260px);
        transform: translate3d(-50%, -50%, 0);
        background: rgba(242, 242, 242, .62);
        box-shadow: 0 0 12px rgba(255, 255, 255, .08);
        pointer-events: none;
      }
      .copyright {
        position: absolute;
        z-index: 4;
        left: 50%;
        bottom: calc(1.5rem + env(safe-area-inset-bottom));
        width: 100%;
        margin: 0;
        transform: translateX(-50%);
        color: rgba(242, 242, 242, .68);
        font: 400 clamp(.625rem, .7vw, .75rem) / 1.2 Arial, Helvetica, sans-serif;
        letter-spacing: .035em;
        text-align: center;
        white-space: nowrap;
      }
      @media (max-width: 700px) {
        .mark-shell {
          left: 8vw;
          top: 11svh;
          width: clamp(140px, 38vw, 210px);
          transform: none;
        }
        .manifesto {
          left: 8vw;
          right: 7vw;
          top: 36svh;
          width: auto;
          transform: none;
          font-size: clamp(1.9rem, 8.25vw, 3.4rem);
          line-height: 1.02;
          letter-spacing: -.035em;
        }
        .separator {
          left: 8vw;
          top: 28svh;
          width: 4rem;
          height: 1px;
          transform: none;
        }
        .copyright {
          bottom: calc(.9rem + env(safe-area-inset-bottom));
          padding: 0 1rem;
          font-size: .625rem;
        }
      }
    </style>
  </head>
  <body>
    <main aria-label="X-QLUSIVE">
      <div class="scene" aria-hidden="true">
        <img class="background" src="background-1920.webp"
          srcset="background-960.webp 960w, background-1920.webp 1920w"
          sizes="100vw" alt="" fetchpriority="high" decoding="async" draggable="false">
      </div>
      <div class="mark-shell" aria-label="X">
        <img class="mark-fallback" src="x-mark.png" alt="" fetchpriority="high" decoding="async">
        <img class="mark-echo mark-echo--top" src="x-mark.png" alt="" aria-hidden="true" decoding="async">
        <img class="mark-echo mark-echo--middle" src="x-mark.png" alt="" aria-hidden="true" decoding="async">
        <img class="mark-echo mark-echo--bottom" src="x-mark.png" alt="" aria-hidden="true" decoding="async">
      </div>
      <div class="separator" aria-hidden="true"></div>
      <p class="manifesto">Creating the Global Platform for Arts, Entertainment and Nightlife.</p>
      <p class="copyright">©2026 X-QLUSIVE GROUP. All Rights Reserved.</p>
    </main>
  <script>
    const revealPage = () => {
      document.documentElement.classList.remove('is-loading');
      document.documentElement.classList.add('is-ready');
    };

    const criticalImages = [...document.querySelectorAll('.background, .mark-fallback')];
    const imageReady = criticalImages.map((image) => {
      if (image.complete && image.naturalWidth) {
        return image.decode ? image.decode().catch(() => {}) : Promise.resolve();
      }
      return new Promise((resolve) => {
        image.addEventListener('load', resolve, { once: true });
        image.addEventListener('error', resolve, { once: true });
      });
    });

    Promise.all(imageReady).then(() => requestAnimationFrame(revealPage));
    setTimeout(revealPage, 2500);

    document.addEventListener('contextmenu', (event) => {
      if (event.target.classList?.contains('background')) event.preventDefault();
    });

    const stopZoom = (event) => event.preventDefault();

      document.addEventListener('wheel', (event) => {
        if (event.ctrlKey || event.metaKey) event.preventDefault();
      }, { passive: false });

      document.addEventListener('keydown', (event) => {
        if ((event.ctrlKey || event.metaKey) && ['+', '=', '-', '_', '0'].includes(event.key)) {
          event.preventDefault();
        }
      });

      document.addEventListener('gesturestart', stopZoom, { passive: false });
      document.addEventListener('gesturechange', stopZoom, { passive: false });
      document.addEventListener('gestureend', stopZoom, { passive: false });
      document.addEventListener('dblclick', stopZoom, { passive: false });
    </script>
  </body>
</html>
