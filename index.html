<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="description" content="Creating the Global Platform for Arts, Entertainment and Nightlife.">
    <title>X-QLUSIVE</title>
    <link rel="icon" type="image/x-icon" href="x_favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="x_favicon.png">
    <style>
      :root { color-scheme: dark; background: #000; }
      * { box-sizing: border-box; }
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #000;
        touch-action: none;
      }
      main {
        position: relative;
        isolation: isolate;
        width: 100%;
        height: 100vh;
        height: 100svh;
        min-height: 360px;
        overflow: hidden;
        background: #000;
      }
      .scene {
        position: absolute;
        z-index: 0;
        inset: 0;
      }
      .scene::before {
        content: none;
      }
      .background {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
        object-position: center;
      }
      .mark {
        position: absolute;
        z-index: 4;
        left: 32vw;
        top: 50%;
        width: clamp(220px, 25vw, 390px);
        height: auto;
        display: block;
        transform: translate3d(-50%, -50%, 0);
        filter: drop-shadow(0 0 16px rgba(255, 255, 255, .18));
        pointer-events: none;
      }
      .manifesto {
        position: absolute;
        z-index: 4;
        right: 7.5vw;
        top: 50%;
        width: min(36vw, 620px);
        margin: 0;
        transform: translateY(-50%);
        color: #f2f2f2;
        font: 400 clamp(2rem, 4vw, 4.75rem) / .98 Arial, Helvetica, sans-serif;
        letter-spacing: -.04em;
        text-wrap: balance;
      }
      .separator {
        position: absolute;
        z-index: 4;
        left: 50%;
        top: 50%;
        width: 1px;
        height: clamp(190px, 18vw, 260px);
        transform: translate3d(-50%, -50%, 0);
        background: rgba(242, 242, 242, .62);
        box-shadow: 0 0 12px rgba(255, 255, 255, .08);
        pointer-events: none;
      }
      .copyright {
        position: absolute;
        z-index: 4;
        left: 50%;
        bottom: calc(1.5rem + env(safe-area-inset-bottom));
        width: 100%;
        margin: 0;
        transform: translateX(-50%);
        color: rgba(242, 242, 242, .68);
        font: 400 clamp(.625rem, .7vw, .75rem) / 1.2 Arial, Helvetica, sans-serif;
        letter-spacing: .035em;
        text-align: center;
        white-space: nowrap;
      }
      @media (max-width: 700px) {
        .mark {
          left: 50%;
          top: 11svh;
          width: clamp(150px, 42vw, 210px);
          transform: translateX(-50%);
        }
        .manifesto {
          left: 7vw;
          right: 7vw;
          top: 36svh;
          width: auto;
          transform: none;
          font-size: clamp(1.9rem, 8.25vw, 3.4rem);
          line-height: 1.02;
          letter-spacing: -.035em;
          text-align: center;
        }
        .separator {
          display: none;
        }
        .copyright {
          bottom: calc(.9rem + env(safe-area-inset-bottom));
          padding: 0 1rem;
          font-size: .625rem;
        }
      }
    </style>
  </head>
  <body>
    <main aria-label="X-QLUSIVE">
      <div class="scene" aria-hidden="true">
        <img class="background" src="adobestock-background.jpeg" alt="">
      </div>
      <img class="mark" src="x-mark.png" alt="X">
      <div class="separator" aria-hidden="true"></div>
      <p class="manifesto">Creating the Global Platform for Arts, Entertainment and Nightlife.</p>
      <p class="copyright">©2026 X-QLUSIVE GROUP. All Rights Reserved.</p>
    </main>
    <script>
      const stopZoom = (event) => event.preventDefault();

      document.addEventListener('wheel', (event) => {
        if (event.ctrlKey || event.metaKey) event.preventDefault();
      }, { passive: false });

      document.addEventListener('keydown', (event) => {
        if ((event.ctrlKey || event.metaKey) && ['+', '=', '-', '_', '0'].includes(event.key)) {
          event.preventDefault();
        }
      });

      document.addEventListener('gesturestart', stopZoom, { passive: false });
      document.addEventListener('gesturechange', stopZoom, { passive: false });
      document.addEventListener('gestureend', stopZoom, { passive: false });
      document.addEventListener('dblclick', stopZoom, { passive: false });
    </script>
  </body>
</html>
